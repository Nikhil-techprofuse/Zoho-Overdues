<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Invoice Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="centered">

<div class="login-box">
    <h2>Invoice Dashboard</h2>
    <input type="text" id="username" placeholder="Username">
    <div class="password-container">
        <input type="password" id="password" placeholder="Password">
        <button type="button" class="toggle-password" onclick="togglePasswordVisibility()" aria-label="Toggle password visibility">
            <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
            </svg>
        </button>
    </div>
    <button onclick="login()" style="width: 100%; margin-top: 10px;">Login</button>
    <p id="error"></p>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
